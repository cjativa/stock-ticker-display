<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LED Ticker</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #e0e0e0;
        --dim: #666;
        --green: #22ff66;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: radial-gradient(ellipse at center, #1a1a1a 0%, #050505 100%);
        color: var(--fg);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        overflow: hidden;
      }

      .stage {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 4px;
        padding: 4px;
        overflow: hidden;
      }

      .panel {
        position: relative;
        padding: 4px;
        border-radius: 6px;
        background: #000;
        box-shadow:
          inset 0 0 0 2px #1a1a1a,
          inset 0 0 0 4px #000,
          0 8px 20px -4px rgba(0,0,0,0.7);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        max-width: 100%;
        height: auto;
        image-rendering: auto;
      }

      #single-panel { display: none; }

      .demo-notice {
        display: none;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        padding: 8px 14px;
        border: 1px solid #2a2a2a;
        border-radius: 999px;
      }

      .demo-notice strong { color: #c5a35a; }

      /* ── View toggle buttons ── */
      .view-toggle {
        position: fixed;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        z-index: 10;
      }

      .toggle-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #111;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.15s, background 0.15s;
      }

      .toggle-btn:hover { border-color: #555; }

      .toggle-btn.active {
        border-color: var(--green);
        background: #0a1a0f;
      }

      /* Single-dot icon */
      .icon-single {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #555;
      }

      .toggle-btn.active .icon-single { background: var(--green); }

      /* Four-dot icon */
      .icon-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
      }

      .icon-grid span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #555;
      }

      .toggle-btn.active .icon-grid span { background: var(--green); }
    </style>
  </head>
  <body>
    <div class="stage">
      <div id="panels"></div>
      <div id="single-panel" class="panel">
        <canvas id="single-canvas"></canvas>
      </div>
      <div class="demo-notice" id="demo-notice">
        <strong>Demo mode</strong> — add a Finnhub API key in
        <code>config.js</code> for live data
      </div>
    </div>

    <div class="view-toggle">
      <button id="btn-single" class="toggle-btn" title="Single ticker">
        <div class="icon-single"></div>
      </button>
      <button id="btn-grid" class="toggle-btn active" title="All tickers">
        <div class="icon-grid">
          <span></span><span></span>
          <span></span><span></span>
        </div>
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
