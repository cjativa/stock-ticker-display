<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LED Ticker</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #e0e0e0;
        --dim: #666;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: radial-gradient(ellipse at center, #1a1a1a 0%, #050505 100%);
        color: var(--fg);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        overflow: hidden;
      }

      .stage {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        padding: 16px;
        overflow: hidden;
      }

      .panel {
        position: relative;
        padding: 10px 16px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        box-shadow:
          inset 0 0 0 2px #1a1a1a,
          inset 0 0 0 4px #000,
          0 20px 40px -10px rgba(0, 0, 0, 0.7),
          0 12px 24px -12px rgba(0, 0, 0, 0.5);
      }

      canvas {
        display: block;
        max-width: 100%;
        height: auto;
        image-rendering: auto;
      }

      .demo-notice {
        display: none;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        padding: 8px 14px;
        border: 1px solid #2a2a2a;
        border-radius: 999px;
      }

      .demo-notice strong {
        color: #c5a35a;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div id="panels"></div>
      <div class="demo-notice" id="demo-notice">
        <strong>Demo mode</strong> — add a Finnhub API key in
        <code>config.js</code> for live data
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
